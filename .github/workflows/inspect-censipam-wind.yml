name: Diagnosticar API vento CENSIPAM

on:
  push:
    paths:
      - '.github/workflows/inspect-censipam-wind.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar endpoint oficial e resumir estrutura
        shell: bash
        run: |
          set -euo pipefail
          URL='https://panorama.sipam.gov.br/painel-do-fogo/api/v1/meteorologia/wrf/vento'
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 3 --connect-timeout 20 --max-time 180 \
            -D /tmp/headers.txt "$URL" -o /tmp/vento.json
          echo '=== HEADERS ==='
          grep -Ei '^(HTTP/|content-type:|content-length:|x-wind-date:|access-control-allow-origin:)' /tmp/headers.txt || true
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/vento.json').read_text(encoding='utf-8'))
          print('objects=', len(data))
          for i,obj in enumerate(data):
              h=obj.get('header',{})
              print(f'=== OBJECT {i} ===')
              wanted=['parameterNumberName','parameterNumber','surface1TypeName','surface1Value','refTime','forecastTime','forecastTimeUnit','forecastTimeUnitName','gridDefinitionTemplate','gridDefinitionTemplateName','numberPoints','nx','ny','lo1','la1','lo2','la2','dx','dy','scanMode','winds','resolutionAndComponentFlags','shape','earthShape','gridUnits']
              for k in wanted:
                  if k in h: print(k,'=',repr(h[k]))
              print('all_header_keys=', sorted(h.keys()))
              vals=obj.get('data',[])
              finite=[]
              for j,v in enumerate(vals):
                  if isinstance(v,(int,float)):
                      finite.append((j,float(v)))
                      if len(finite)>=8: break
              print('data_len=',len(vals),'finite_samples=',finite)
          PY
