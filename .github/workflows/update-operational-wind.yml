name: Atualizar vento operacional

on:
  push:
    paths:
      - 'scripts/update_operational_wind.py'
      - '.github/workflows/update-operational-wind.yml'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operational-wind-update
  cancel-in-progress: true

jobs:
  update-wind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependência HTTP
        run: python -m pip install requests

      - name: Gerar vento oficial do Painel do Fogo
        run: python scripts/update_operational_wind.py

      - name: Publicar JSON no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/vento/operational_wind.json
          if git diff --cached --quiet; then
            echo "Sem alteração de vento para publicar."
            exit 0
          fi
          git commit -m "Atualiza vento oficial do Painel do Fogo [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
